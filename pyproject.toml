[project]
name = "docusync-ai"
version = "0.1.0"
description = "AI-powered document extraction portal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "instructor>=1.16.0",
    "mcp>=2.1.1",
    "openai>=2.54.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "sqlmodel>=0.0.42",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
