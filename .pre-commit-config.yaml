# .pre-commit-config.yaml
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--output-format=concise]
      - id: ruff-format

  - repo: local
    hooks:
      - id: diff-check
        name: Check diff whitespace
        entry: git diff --check
        language: system
        pass_filenames: false