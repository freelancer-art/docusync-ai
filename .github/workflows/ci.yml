name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 poppler-utils

      - name: Sync project and dev dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run --extra dev pytest -q

      - name: Run lint
        run: uv run --extra dev ruff check app tests

      - name: Check formatting
        run: uv run --extra dev ruff format --check app tests

      - name: Check diff whitespace
        run: git diff --check